name: rebuild profile

on:
  schedule:
    # 23:10 UTC, which is early morning in WIB
    - cron: "10 23 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/profile.yml"

concurrency:
  group: rebuild-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render README and header
        run: node scripts/build-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/header.svg
          git diff --staged --quiet && echo "nothing to update" && exit 0
          git commit -m "chore: refresh profile from the GitHub API"
          git push
